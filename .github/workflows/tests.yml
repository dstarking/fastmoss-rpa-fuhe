name: CLI and offline tests
on:
  push:
    branches: ['feature/**', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python fastmoss_rpa.py --help
      - run: python fastmoss_rpa.py sales --help
      - run: python fastmoss_rpa.py pet-sales --help
      - run: python fastmoss_rpa.py pet-analyze --help
